<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 보안 학습 대시보드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Web Security Lab</h1>
        <p>합법적이고 안전하게 배우는 화이트햇 해킹 & 보안 플랫폼</p>
    </header>

    <main class="container">
        <section class="card-grid">
            <div class="card">
                <h3>TryHackMe</h3>
                <p>초보자 모의해킹 가이드 및 단계별 가상 환경 실습</p>
                <a href="https://tryhackme.com" target="_blank" class="btn">방문하기</a>
            </div>

            <div class="card">
                <h3>Hack The Box</h3>
                <p>실전 난이도의 서버 및 웹 애플리케이션 모의 침투 실습</p>
                <a href="https://www.hackthebox.com" target="_blank" class="btn">방문하기</a>
            </div>

            <div class="card">
                <h3>PortSwigger Academy</h3>
                <p>Burp Suite 제작사에서 제공하는 무료 웹 취약점 종합 강의</p>
                <a href="https://portswigger.net/web-security" target="_blank" class="btn">방문하기</a>
            </div>
        </section>

        <section class="interactive-section">
            <h2>주요 웹 취약점 개요</h2>
            <div class="button-group">
                <button onclick="showInfo('sqli')">SQL Injection</button>
                <button onclick="showInfo('xss')">XSS (Cross-Site Scripting)</button>
                <button onclick="showInfo('csrf')">CSRF</button>
            </div>
            <div id="info-box" class="info-box">
                버튼을 클릭하면 각 취약점의 개요가 표시됩니다.
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
